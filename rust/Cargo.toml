[workspace]
resolver = "3"
members = [
  "crates/tessera-core",
  "crates/tessera-protocol",
  "crates/tessera-wasm",
  "crates/tessera-cli",
  "crates/tessera-arena",
]

[workspace.package]
edition = "2024"
version = "0.0.0"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
