name: debug-pack
on:
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/pack-runtime.mjs /tmp/ci-pack
      - run: find /tmp/ci-pack dist/package dist/package/assets -type f | sort | xargs sha256sum
      - run: sha256sum /tmp/ci-pack/*.tgz