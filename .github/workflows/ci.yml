name: foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.19.0
          run_install: false

      - name: install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: verify JavaScript tools
        run: |
          test "$(node --version)" = "v24.18.1"
          test "$(pnpm --version)" = "11.19.0"

      - name: install Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustc --version | grep -E '^rustc 1\.97\.1 '
          cargo --version | grep -E '^cargo 1\.97\.1 '
          rustup target list --installed | grep -Fx wasm32-unknown-unknown

      - name: cache Cargo data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: ${{ runner.os }}-rust-1.97.1-${{ hashFiles('rust/Cargo.lock') }}

      - name: install wasm-bindgen
        run: |
          cargo install wasm-bindgen-cli --version 0.2.126 --locked --root "${RUNNER_TEMP}/tessera-tools"
          echo "${RUNNER_TEMP}/tessera-tools/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/tessera-tools/bin/wasm-bindgen" --version | grep -E '^wasm-bindgen 0\.2\.126$'

      - name: install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: verify Fallow policy
        run: |
          test "$(pnpm exec fallow --version | sed -n '1p')" = "fallow 3.10.0"
          node scripts/check-fallow-policy.mjs

      - name: audit JavaScript structure
        env:
          DO_NOT_TRACK: '1'
        run: pnpm exec fallow audit --base origin/main --format github-summary --fail-on-issues --quiet >> "$GITHUB_STEP_SUMMARY"

      - name: check formatting
        run: pnpm check:format

      - name: lint JavaScript
        run: pnpm lint

      - name: typecheck JavaScript
        run: pnpm typecheck

      - name: run Vitest
        run: pnpm test

      - name: check native Rust
        run: pnpm check:rust

      - name: build Wasm target
        run: pnpm check:wasm

      - name: build production shell
        run: pnpm build

      - name: verify development test surface is excluded
        run: pnpm check:production-testkit

      - name: verify package export and content contract
        run: pnpm check:package

      - name: verify release gates
        run: pnpm check:release

      - name: diagnose wasm reproducibility
        if: failure()
        run: |
          sha256sum src/worker/wasm/tessera_wasm_bg.wasm
          strings src/worker/wasm/tessera_wasm_bg.wasm | grep -E 'rustlib|rustc/|cargo-registry|build-path|home/runner|Users/' | sort -u | head -40

      - name: upload ci wasm
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-wasm
          path: src/worker/wasm/tessera_wasm_bg.wasm
          if-no-files-found: error

      - name: upload ci packed tarball
        if: failure()
        run: |
          mkdir -p /tmp/ci-pack
          node scripts/pack-runtime.mjs /tmp/ci-pack
        shell: bash

      - name: upload ci tarball
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-tarball
          path: /tmp/ci-pack/*.tgz
          if-no-files-found: error

      - name: upload production shell
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scenario-lab-dist
          path: dist/scenario-lab

  browser:
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble

    steps:
      - name: check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.19.0
          run_install: false

      - name: install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: verify browser toolchain
        run: |
          test "$(node --version)" = "v24.18.1"
          test "$(pnpm --version)" = "11.19.0"

      - name: install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: verify Playwright toolchain
        run: test "$(pnpm exec playwright --version)" = "Version 1.60.0"

      - name: download production shell
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: scenario-lab-dist
          path: dist/scenario-lab

      - name: run Chromium browser flows
        run: pnpm test:e2e

      - name: run canonical Chromium visuals
        run: pnpm test:visual

      - name: run production Chromium smoke
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4174 > "${RUNNER_TEMP}/tessera-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          TESSERA_BASE_URL=http://127.0.0.1:4174 pnpm test:e2e:production

      - name: run Firefox and WebKit smoke
        env:
          HOME: /root
        run: pnpm test:e2e:compat

      - name: upload browser artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore

  external-consumer:
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble

    steps:
      - name: check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.19.0
          run_install: false

      - name: install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: verify external-consumer toolchain
        run: |
          test "$(node --version)" = "v24.18.1"
          test "$(pnpm --version)" = "11.19.0"

      - name: install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: verify package export and content contract
        run: pnpm check:package

      - name: run isolated external consumer
        run: pnpm check:external-consumer
