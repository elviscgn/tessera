name: foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.19.0
          run_install: false

      - name: install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: verify JavaScript tools
        run: |
          test "$(node --version)" = "v24.18.1"
          test "$(pnpm --version)" = "11.19.0"

      - name: install Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustc --version | grep -E '^rustc 1\.97\.1 '
          cargo --version | grep -E '^cargo 1\.97\.1 '
          rustup target list --installed | grep -Fx wasm32-unknown-unknown

      - name: cache Cargo data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: ${{ runner.os }}-rust-1.97.1-${{ hashFiles('rust/Cargo.lock') }}

      - name: install wasm-pack
        run: |
          cargo install wasm-pack --version 0.15.0 --locked --root "${RUNNER_TEMP}/tessera-tools"
          echo "${RUNNER_TEMP}/tessera-tools/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/tessera-tools/bin/wasm-pack" --version | grep -E '^wasm-pack 0\.15\.0'

      - name: install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: verify Fallow policy
        run: |
          test "$(pnpm exec fallow --version)" = "fallow 3.10.0"
          node scripts/check-fallow-policy.mjs

      - name: audit JavaScript structure
        env:
          DO_NOT_TRACK: '1'
        run: pnpm exec fallow audit --base origin/main --format github-summary --fail-on-issues --quiet >> "$GITHUB_STEP_SUMMARY"

      - name: check formatting
        run: pnpm check:format

      - name: lint JavaScript
        run: pnpm lint

      - name: typecheck JavaScript
        run: pnpm typecheck

      - name: run Vitest
        run: pnpm test

      - name: check native Rust
        run: pnpm check:rust

      - name: build Wasm target
        run: pnpm check:wasm

      - name: build production shell
        run: pnpm build
