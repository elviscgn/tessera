<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tessera foundation laboratory</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }

      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      #app {
        position: relative;
        overflow: hidden;
        background: #090c13;
      }

      #renderCanvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }

      #status {
        position: absolute;
        z-index: 1;
        top: 0.75rem;
        left: 0.75rem;
        padding: 0.4rem 0.6rem;
        border: 1px solid #334155;
        border-radius: 0.35rem;
        background: rgb(9 12 19 / 82%);
        color: #dbeafe;
        font:
          0.82rem ui-monospace,
          monospace;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <canvas id="renderCanvas" aria-label="Tessera foundation viewport"></canvas>
      <output id="status" data-tessera-status="starting">Tessera starting</output>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
